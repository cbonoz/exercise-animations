<text x="200" y="58" fill="#666" font-size="10" font-family="sans-serif" text-anchor="middle"><tspan x="200" dy="0">Lie on back, arms up, legs in tabletop; slowly extend</tspan><tspan x="200" dy="14">opposite arm and leg toward floor while keeping lower</tspan><tspan x="200" dy="14">back pressed down, return and alternate.</tspan></text>
